name: Test Windows Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-windows:
    name: Test Windows Build
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Ensure Coral vendor sources
      run: |
        if (!(Test-Path "Limitless\Vendor\Coral\Coral.Native\Include\Coral\Assembly.hpp")) {
          if (Test-Path "Limitless\Vendor\Coral") {
            Remove-Item -Recurse -Force "Limitless\Vendor\Coral"
          }
          git clone https://github.com/hcfgod/Coral.git "Limitless\Vendor\Coral"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          git -C "Limitless\Vendor\Coral" checkout c8e0d53356dd0310595e83b700b469086af63a54
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (Test-Path "Limitless\Vendor\Coral\.git") {
            Remove-Item -Recurse -Force "Limitless\Vendor\Coral\.git"
          }
        }
        if (!(Test-Path "Limitless\Vendor\Coral\Coral.Native\Include\Coral\Assembly.hpp")) {
          throw "Missing Limitless\Vendor\Coral\Coral.Native\Include\Coral\Assembly.hpp"
        }
      
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      
    - name: Download Premake5
      run: |
        echo "Downloading premake5..."
        if (!(Test-Path "Vendor\Premake")) {
          New-Item -ItemType Directory -Path "Vendor\Premake" -Force
        }
        
        # Download the latest beta version that supports VS2022
        $premakeUrl = "https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-windows.zip"
        $premakeZip = "Vendor\Premake\premake5.zip"
        $premakeDir = "Vendor\Premake"
        
        Invoke-WebRequest -Uri $premakeUrl -OutFile $premakeZip
        Expand-Archive -Path $premakeZip -DestinationPath $premakeDir -Force
        Remove-Item $premakeZip
        
        echo "Premake5 downloaded and extracted"
        Vendor\Premake\premake5.exe --version
        
    - name: Generate Visual Studio solution
      run: |
        echo "Generating Visual Studio solution..."
        
        # Try vs2022 first, fallback to vs2019 if not supported
        $vsAction = "vs2022"
        Vendor\Premake\premake5.exe $vsAction
        if ($LASTEXITCODE -ne 0) {
          echo "vs2022 failed, trying vs2019..."
          $vsAction = "vs2019"
          Vendor\Premake\premake5.exe $vsAction
          if ($LASTEXITCODE -ne 0) {
            echo "vs2019 failed, trying vs2017..."
            $vsAction = "vs2017"
            Vendor\Premake\premake5.exe $vsAction
            if ($LASTEXITCODE -ne 0) {
              echo "Error: Failed to generate Visual Studio solution with any supported action"
              exit 1
            }
          }
        }
        
        echo "Generated solution with action: $vsAction"
        echo "Generated files:"
        Get-ChildItem -Name "*.sln"
        
    - name: Build project
      run: |
        echo "Building with detailed output..."
        msbuild LimitlessRemaster.sln /p:Configuration=Debug /p:Platform=x64 /m /v:detailed /p:BuildProjectReferences=true
        
        if ($LASTEXITCODE -ne 0) {
          echo "Error: Build failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }
        
        echo "Build completed successfully!"
        
    - name: List build output
      run: |
        echo "Build directory contents:"
        if (Test-Path "Build") {
          Get-ChildItem Build -Recurse | Format-Table Name, FullName
        } else {
          echo "Build directory not found!"
          exit 1
        }
        
    - name: Run tests
      run: |
        # Premake output directories use cfg.shortname (e.g. Build\debug_x64-windows-x64\...)
        # so we locate the test exe rather than assuming a fixed folder name.
        $testExe = Get-ChildItem -Path Build -Recurse -Filter "Test.exe" -ErrorAction SilentlyContinue |
          Select-Object -First 1 -ExpandProperty FullName

        if ($null -ne $testExe -and (Test-Path $testExe)) {
          echo "Running tests: $testExe"
          & $testExe --success
          if ($LASTEXITCODE -ne 0) {
            echo "Error: Some tests failed"
            exit $LASTEXITCODE
          } else {
            echo "All tests passed!"
          }
        } else {
          echo "Test executable not found under Build/"
          echo "Available executables:"
          Get-ChildItem Build -Recurse -Name "*.exe" -ErrorAction SilentlyContinue
          exit 1
        }
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: windows-build-artifacts
        path: |
          Build/
          *.sln
        retention-days: 7 