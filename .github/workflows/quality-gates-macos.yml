name: Quality Gates macOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sanitizer-macos:
    name: Sanitizer (${{ matrix.gate_name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate_name: asan-ubsan
            san_flags: -fsanitize=address,undefined
          - gate_name: tsan
            san_flags: -fsanitize=thread

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Coral vendor sources
        run: |
          if [ ! -f "Limitless/Vendor/Coral/Coral.Native/Include/Coral/Assembly.hpp" ]; then
            rm -rf Limitless/Vendor/Coral
            git clone --depth 1 https://github.com/StudioCherno/Coral.git Limitless/Vendor/Coral
            rm -rf Limitless/Vendor/Coral/.git
          fi
          test -f "Limitless/Vendor/Coral/Coral.Native/Include/Coral/Assembly.hpp"

      - name: Install dependencies
        run: |
          brew install pkg-config sdl3 box2d ffmpeg

      - name: Download premake5
        run: |
          curl -L -o premake5.tar.gz https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-macosx.tar.gz
          tar -xzf premake5.tar.gz
          chmod +x premake5

      - name: Generate Makefiles (clang)
        run: ./premake5 gmake2 --cc=clang

      - name: Build with sanitizer
        env:
          SAN_FLAGS: ${{ matrix.san_flags }}
        run: |
          make -j"$(sysctl -n hw.ncpu)" config=debug_arm64 \
            CC=clang CXX=clang++ \
            CFLAGS="${SAN_FLAGS} -fno-omit-frame-pointer" \
            CXXFLAGS="${SAN_FLAGS} -fno-omit-frame-pointer" \
            LDFLAGS="${SAN_FLAGS}"

      - name: Run tests with sanitizer
        env:
          GATE_NAME: ${{ matrix.gate_name }}
        run: |
          TEST_EXE=""
          for candidate in Build/*/Test/Test; do
            if [ -f "$candidate" ]; then
              TEST_EXE="$candidate"
              break
            fi
          done

          if [ -z "$TEST_EXE" ]; then
            echo "Test executable not found"
            exit 1
          fi

          case "$GATE_NAME" in
            asan-ubsan)
              # macOS ASan runtime does not support leak sanitizer mode.
              export ASAN_OPTIONS="strict_init_order=1:halt_on_error=1"
              export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"
              ;;
            tsan)
              export TSAN_OPTIONS="halt_on_error=1:history_size=7"
              ;;
          esac

          "$TEST_EXE" --no-success --abort-after=1

  clang-tidy-macos:
    name: Clang-Tidy Gate
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Coral vendor sources
        run: |
          if [ ! -f "Limitless/Vendor/Coral/Coral.Native/Include/Coral/Assembly.hpp" ]; then
            rm -rf Limitless/Vendor/Coral
            git clone --depth 1 https://github.com/StudioCherno/Coral.git Limitless/Vendor/Coral
            rm -rf Limitless/Vendor/Coral/.git
          fi
          test -f "Limitless/Vendor/Coral/Coral.Native/Include/Coral/Assembly.hpp"

      - name: Install dependencies
        run: |
          brew install pkg-config sdl3 box2d ffmpeg llvm bear ripgrep

      - name: Download premake5
        run: |
          curl -L -o premake5.tar.gz https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-macosx.tar.gz
          tar -xzf premake5.tar.gz
          chmod +x premake5

      - name: Generate Makefiles (clang)
        run: ./premake5 gmake2 --cc=clang

      - name: Build compile database
        run: |
          bear -- make -k -j"$(sysctl -n hw.ncpu)" config=debug_arm64 || true
          if [ ! -f compile_commands.json ]; then
            echo "compile_commands.json was not generated"
            exit 1
          fi

      - name: Run clang-tidy (hard fail on warnings)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          CLANG_TIDY_BIN="$(xcrun --find clang-tidy 2>/dev/null || true)"
          if [ -z "$CLANG_TIDY_BIN" ]; then
            CLANG_TIDY_BIN="$(brew --prefix llvm)/bin/clang-tidy"
          fi
          if [ ! -x "$CLANG_TIDY_BIN" ]; then
            echo "clang-tidy not found at $CLANG_TIDY_BIN"
            exit 1
          fi

          # Homebrew clang-tidy can fail on Apple-clang generated PCH artifacts.
          # Strip -include-pch flags from compile_commands to keep analysis portable.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shlex

          repo_root = Path(os.getcwd()).resolve()

          with open("compile_commands.json", "r", encoding="utf-8") as f:
              database = json.load(f)

          for entry in database:
              original_file = entry.get("file", "")
              args = entry.get("arguments")
              if args is None:
                  args = shlex.split(entry.get("command", ""))
                  entry["arguments"] = args
                  entry.pop("command", None)

              cleaned = []
              i = 0
              while i < len(args):
                  arg = args[i]
                  # Direct PCH flags.
                  if arg in ("-include-pch", "-include"):
                      if i + 1 < len(args):
                          next_arg = args[i + 1]
                          if "PrecompiledHeader.h" in next_arg or next_arg.endswith(".gch") or arg == "-include-pch":
                              i += 2
                              continue
                  if arg.startswith("-include-pch=") or (
                      arg.startswith("-include") and ("PrecompiledHeader.h" in arg or arg.endswith(".gch"))
                  ):
                      i += 1
                      continue
                  if arg == "-Winvalid-pch":
                      i += 1
                      continue

                  # Clang frontend form: -Xclang <flag> [-Xclang <value>]
                  if arg == "-Xclang" and i + 1 < len(args):
                      frontend_flag = args[i + 1]
                      if frontend_flag in ("-include-pch", "-include", "-Winvalid-pch"):
                          i += 2
                          if frontend_flag in ("-include-pch", "-include"):
                              if i < len(args) and args[i] == "-Xclang":
                                  i += 2  # -Xclang <pch-or-header-path>
                              elif i < len(args):
                                  i += 1
                          continue

                  # Drop any standalone stale gch reference.
                  if "PrecompiledHeader.h.gch" in arg:
                      i += 1
                      continue

                  cleaned.append(arg)
                  i += 1

              # Normalize source file path and working directory so clang-tidy can
              # reliably read files across subprojects (Editor/Limitless/Runtime/Test).
              file_candidate = None
              if original_file:
                  raw_file = Path(original_file)
                  directory = Path(entry.get("directory", "."))
                  if not directory.is_absolute():
                      directory = (repo_root / directory).resolve()
                  file_candidate = raw_file if raw_file.is_absolute() else (directory / raw_file).resolve()

                  if not file_candidate.exists():
                      fallback_candidates = []
                      if not raw_file.is_absolute():
                          fallback_candidates.append((repo_root / raw_file).resolve())
                          if str(raw_file).startswith("Source/"):
                              for project_root in ("Limitless", "Editor", "Runtime", "Test"):
                                  fallback_candidates.append((repo_root / project_root / raw_file).resolve())

                      for candidate in fallback_candidates:
                          if candidate.exists():
                              file_candidate = candidate
                              break

                  if file_candidate.exists():
                      entry["file"] = str(file_candidate)
                      cleaned = [str(file_candidate) if arg == original_file else arg for arg in cleaned]

              entry["arguments"] = cleaned

          with open("compile_commands.json", "w", encoding="utf-8") as f:
              json.dump(database, f, indent=2)
          PY

          BASE_SHA=""
          HEAD_SHA=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            HEAD_SHA="$PR_HEAD_SHA"
            if [ -n "$PR_BASE_REF" ]; then
              git fetch --no-tags --prune --depth=200 origin "refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF" || true
            fi
            if [ -n "$PR_BASE_SHA" ] && ! git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --prune --depth=200 origin "$PR_BASE_SHA" || true
            fi
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$PUSH_HEAD_SHA"
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              if [ -n "$HEAD_SHA" ] && git cat-file -e "${HEAD_SHA}^" 2>/dev/null; then
                BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
              fi
            fi
          fi

          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_REF" ] && \
             [ -n "$HEAD_SHA" ] && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null && \
             git rev-parse --verify "origin/$PR_BASE_REF" >/dev/null 2>&1; then
            (git diff --name-only --diff-filter=ACMR "origin/$PR_BASE_REF...$HEAD_SHA" | rg '^(Limitless|Editor|Runtime|Test)/Source/.*\.cpp$' > clang-tidy-files.txt) || true
          elif [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ] && [ -n "$HEAD_SHA" ] && \
               git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            (git diff --name-only --diff-filter=ACMR "$PR_BASE_SHA" "$HEAD_SHA" | rg '^(Limitless|Editor|Runtime|Test)/Source/.*\.cpp$' > clang-tidy-files.txt) || true
          elif [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && \
               [ -n "$HEAD_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            (git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" | rg '^(Limitless|Editor|Runtime|Test)/Source/.*\.cpp$' > clang-tidy-files.txt) || true
          elif [ -n "$HEAD_SHA" ] && git cat-file -e "${HEAD_SHA}^" 2>/dev/null && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            PARENT_SHA="$(git rev-parse "${HEAD_SHA}^")"
            (git diff --name-only --diff-filter=ACMR "$PARENT_SHA" "$HEAD_SHA" | rg '^(Limitless|Editor|Runtime|Test)/Source/.*\.cpp$' > clang-tidy-files.txt) || true
          elif [ -n "$HEAD_SHA" ] && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "Diff base commit unavailable; falling back to changed files in HEAD commit."
            (git show --name-only --pretty="" --diff-filter=ACMR "$HEAD_SHA" | rg '^(Limitless|Editor|Runtime|Test)/Source/.*\.cpp$' > clang-tidy-files.txt) || true
          else
            echo "Unable to determine changed files from git history."
            : > clang-tidy-files.txt
          fi

          if [ ! -s clang-tidy-files.txt ]; then
            echo "No changed first-party source files to analyze."
            exit 0
          fi
          sort -u -o clang-tidy-files.txt clang-tidy-files.txt

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          repo_root = Path(os.getcwd()).resolve()
          with open("compile_commands.json", "r", encoding="utf-8") as f:
              database = json.load(f)

          compile_db_files = set()
          for entry in database:
              file_path = entry.get("file")
              if not file_path:
                  continue

              directory = Path(entry.get("directory", "."))
              if not directory.is_absolute():
                  directory = (repo_root / directory).resolve()

              candidate = Path(file_path)
              if not candidate.is_absolute():
                  candidate = (directory / candidate).resolve()
              else:
                  candidate = candidate.resolve()

              try:
                  rel = candidate.relative_to(repo_root).as_posix()
                  compile_db_files.add(rel)
              except ValueError:
                  pass

          changed_files_path = repo_root / "clang-tidy-files.txt"
          with changed_files_path.open("r", encoding="utf-8") as f:
              changed = [line.strip() for line in f if line.strip()]

          filtered = [path for path in changed if path in compile_db_files]
          with changed_files_path.open("w", encoding="utf-8") as f:
              f.write("\n".join(filtered))
              if filtered:
                  f.write("\n")
          print(f"Filtered changed files to {len(filtered)} entries present in compile_commands.json.")
          PY

          if [ ! -s clang-tidy-files.txt ]; then
            echo "No changed source files matched compile_commands.json entries."
            exit 0
          fi
          echo "Analyzing $(wc -l < clang-tidy-files.txt) changed C++ source files."

          SDKROOT_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          echo "Using clang-tidy: $CLANG_TIDY_BIN"
          echo "Using SDKROOT: $SDKROOT_PATH"

          # Batch files per invocation to reduce startup cost and log volume.
          xargs -r -n 40 "$CLANG_TIDY_BIN" -p . -quiet \
            --extra-arg-before=-isysroot \
            --extra-arg-before="$SDKROOT_PATH" \
            --extra-arg-before=-stdlib=libc++ \
            --extra-arg-before="-I/opt/homebrew/include" \
            --extra-arg-before="-I/usr/local/include" \
            --extra-arg-before="-I${PWD}/Editor" \
            --extra-arg-before="-I${PWD}/Editor/Source" \
            --extra-arg-before="-I${PWD}/Limitless" \
            --extra-arg-before="-I${PWD}/Limitless/Source" \
            --extra-arg-before="-I${PWD}/Limitless/Vendor" \
            --extra-arg-before="-I${PWD}/Limitless/Vendor/doctest" \
            --extra-arg-before="-I${PWD}/Runtime" \
            --extra-arg-before="-I${PWD}/Runtime/Source" \
            --extra-arg-before="-I${PWD}/Test" \
            --extra-arg-before="-I${PWD}/Test/Source" \
            -header-filter='.*/(Limitless|Editor|Runtime|Test)/Source/.*' \
            -checks='-*,clang-analyzer-*,-clang-analyzer-optin.core.EnumCastOutOfRange,-clang-analyzer-cplusplus.NewDeleteLeaks,-clang-analyzer-optin.cplusplus.UninitializedObject' \
            -warnings-as-errors='*' < clang-tidy-files.txt
