name: Quality Gates macOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sanitizer-macos:
    name: Sanitizer (${{ matrix.gate_name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate_name: asan-ubsan
            san_flags: -fsanitize=address,undefined
          - gate_name: tsan
            san_flags: -fsanitize=thread

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install pkg-config sdl3 box2d ffmpeg

      - name: Download premake5
        run: |
          curl -L -o premake5.tar.gz https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-macosx.tar.gz
          tar -xzf premake5.tar.gz
          chmod +x premake5

      - name: Generate Makefiles (clang)
        run: ./premake5 gmake2 --cc=clang

      - name: Build with sanitizer
        env:
          SAN_FLAGS: ${{ matrix.san_flags }}
        run: |
          make -j"$(sysctl -n hw.ncpu)" config=debug_arm64 \
            CC=clang CXX=clang++ \
            CFLAGS="${SAN_FLAGS} -fno-omit-frame-pointer" \
            CXXFLAGS="${SAN_FLAGS} -fno-omit-frame-pointer" \
            LDFLAGS="${SAN_FLAGS}"

      - name: Run tests with sanitizer
        env:
          GATE_NAME: ${{ matrix.gate_name }}
        run: |
          TEST_EXE=""
          for candidate in Build/*/Test/Test; do
            if [ -f "$candidate" ]; then
              TEST_EXE="$candidate"
              break
            fi
          done

          if [ -z "$TEST_EXE" ]; then
            echo "Test executable not found"
            exit 1
          fi

          case "$GATE_NAME" in
            asan-ubsan)
              # macOS ASan runtime does not support leak sanitizer mode.
              export ASAN_OPTIONS="strict_init_order=1:halt_on_error=1"
              export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"
              ;;
            tsan)
              export TSAN_OPTIONS="halt_on_error=1:history_size=7"
              ;;
          esac

          "$TEST_EXE" --no-success --abort-after=1

  clang-tidy-macos:
    name: Clang-Tidy Gate
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install pkg-config sdl3 box2d ffmpeg llvm bear ripgrep

      - name: Download premake5
        run: |
          curl -L -o premake5.tar.gz https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-macosx.tar.gz
          tar -xzf premake5.tar.gz
          chmod +x premake5

      - name: Generate Makefiles (clang)
        run: ./premake5 gmake2 --cc=clang

      - name: Build compile database
        run: |
          bear -- make -k -j"$(sysctl -n hw.ncpu)" config=debug_arm64 || true
          if [ ! -f compile_commands.json ]; then
            echo "compile_commands.json was not generated"
            exit 1
          fi

      - name: Run clang-tidy (hard fail on warnings)
        run: |
          CLANG_TIDY_BIN="$(xcrun --find clang-tidy 2>/dev/null || true)"
          if [ -z "$CLANG_TIDY_BIN" ]; then
            CLANG_TIDY_BIN="$(brew --prefix llvm)/bin/clang-tidy"
          fi
          if [ ! -x "$CLANG_TIDY_BIN" ]; then
            echo "clang-tidy not found at $CLANG_TIDY_BIN"
            exit 1
          fi

          # Homebrew clang-tidy can fail on Apple-clang generated PCH artifacts.
          # Strip -include-pch flags from compile_commands to keep analysis portable.
          python3 - <<'PY'
          import json
          import shlex

          with open("compile_commands.json", "r", encoding="utf-8") as f:
              database = json.load(f)

          for entry in database:
              args = entry.get("arguments")
              if args is None:
                  args = shlex.split(entry.get("command", ""))
                  entry["arguments"] = args
                  entry.pop("command", None)

              cleaned = []
              i = 0
              while i < len(args):
                  arg = args[i]
                  if arg == "-include-pch":
                      i += 2
                      continue
                  if arg.startswith("-include-pch="):
                      i += 1
                      continue
                  cleaned.append(arg)
                  i += 1

              entry["arguments"] = cleaned

          with open("compile_commands.json", "w", encoding="utf-8") as f:
              json.dump(database, f, indent=2)
          PY

          git ls-files | rg '^(Limitless|Editor|Runtime|Test)/Source/.*\.cpp$' > clang-tidy-files.txt
          if [ ! -s clang-tidy-files.txt ]; then
            echo "No first-party source files matched clang-tidy file filter."
            exit 1
          fi

          # Batch files per invocation to reduce startup cost and log volume.
          xargs -n 40 "$CLANG_TIDY_BIN" -p . -quiet \
            -checks='-*,clang-analyzer-*' \
            -warnings-as-errors='*' < clang-tidy-files.txt
