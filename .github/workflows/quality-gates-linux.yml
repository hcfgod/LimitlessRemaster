name: Quality Gates Linux

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sanitizer-linux:
    name: Sanitizer (${{ matrix.gate_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate_name: asan-ubsan
            san_flags: -fsanitize=address,undefined
          - gate_name: tsan
            san_flags: -fsanitize=thread

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make cmake pkg-config git clang
          sudo apt-get install -y libasound2-dev libpulse-dev libaudio-dev libjack-dev
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxxf86vm-dev libxss-dev
          sudo apt-get install -y libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev
          sudo apt-get install -y libdbus-1-dev libudev-dev libibus-1.0-dev
          sudo apt-get install -y libdrm-dev libgbm-dev
          sudo apt-get install -y libwayland-dev libxkbcommon-dev
          sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev libswresample-dev

      - name: Install Box2D 3.x
        run: |
          cd /tmp
          rm -rf box2d
          git clone --depth 1 --branch v3.1.1 https://github.com/erincatto/box2d.git
          cmake -S box2d -B box2d/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build box2d/build --parallel "$(nproc)"
          sudo cmake --install box2d/build
          sudo ldconfig

      - name: Install SDL3
        run: |
          if sudo apt-get install -y libsdl3-dev 2>/dev/null; then
            echo "SDL3 installed from package manager"
          else
            cd /tmp
            rm -rf SDL
            git clone https://github.com/libsdl-org/SDL.git
            cd SDL
            git checkout release-3.2.18
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSDL_STATIC=OFF -DSDL_SHARED=ON -DSDL_TEST=OFF -DSDL_OPENGL=ON -DSDL_OPENGLES=ON
            cmake --build build --parallel "$(nproc)"
            sudo cmake --install build
            sudo ldconfig
          fi

      - name: Download premake5
        run: |
          curl -L -o premake5.tar.gz https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz
          tar -xzf premake5.tar.gz
          chmod +x premake5

      - name: Generate Makefiles (clang)
        run: ./premake5 gmake2 --cc=clang

      - name: Build with sanitizer
        env:
          SAN_FLAGS: ${{ matrix.san_flags }}
        run: |
          export LIBRARY_PATH="/usr/local/lib:${LIBRARY_PATH}"
          export LD_LIBRARY_PATH="/usr/local/lib:${LD_LIBRARY_PATH}"
          make -j"$(nproc)" config=debug_x64 \
            CC=clang CXX=clang++ \
            CFLAGS="${SAN_FLAGS} -fno-omit-frame-pointer" \
            CXXFLAGS="${SAN_FLAGS} -fno-omit-frame-pointer" \
            LDFLAGS="${SAN_FLAGS}"

      - name: Run tests with sanitizer
        env:
          GATE_NAME: ${{ matrix.gate_name }}
        run: |
          export LD_LIBRARY_PATH="/usr/local/lib:${LD_LIBRARY_PATH}"

          TEST_EXE=""
          for candidate in Build/*/Test/Test; do
            if [ -f "$candidate" ]; then
              TEST_EXE="$candidate"
              break
            fi
          done

          if [ -z "$TEST_EXE" ]; then
            echo "Test executable not found"
            exit 1
          fi

          case "$GATE_NAME" in
            asan-ubsan)
              export ASAN_OPTIONS="detect_leaks=1:strict_init_order=1:halt_on_error=1"
              export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"
              ;;
            tsan)
              export TSAN_OPTIONS="halt_on_error=1:history_size=7"
              ;;
          esac

          "$TEST_EXE" --no-success --abort-after=1

  clang-tidy-linux:
    name: Clang-Tidy Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make cmake pkg-config git clang clang-tidy bear ripgrep
          sudo apt-get install -y libasound2-dev libpulse-dev libaudio-dev libjack-dev
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxxf86vm-dev libxss-dev
          sudo apt-get install -y libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev
          sudo apt-get install -y libdbus-1-dev libudev-dev libibus-1.0-dev
          sudo apt-get install -y libdrm-dev libgbm-dev
          sudo apt-get install -y libwayland-dev libxkbcommon-dev
          sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev libswresample-dev

      - name: Install Box2D 3.x
        run: |
          cd /tmp
          rm -rf box2d
          git clone --depth 1 --branch v3.1.1 https://github.com/erincatto/box2d.git
          cmake -S box2d -B box2d/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build box2d/build --parallel "$(nproc)"
          sudo cmake --install box2d/build
          sudo ldconfig

      - name: Install SDL3
        run: |
          if sudo apt-get install -y libsdl3-dev 2>/dev/null; then
            echo "SDL3 installed from package manager"
          else
            cd /tmp
            rm -rf SDL
            git clone https://github.com/libsdl-org/SDL.git
            cd SDL
            git checkout release-3.2.18
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSDL_STATIC=OFF -DSDL_SHARED=ON -DSDL_TEST=OFF -DSDL_OPENGL=ON -DSDL_OPENGLES=ON
            cmake --build build --parallel "$(nproc)"
            sudo cmake --install build
            sudo ldconfig
          fi

      - name: Download premake5
        run: |
          curl -L -o premake5.tar.gz https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz
          tar -xzf premake5.tar.gz
          chmod +x premake5

      - name: Generate Makefiles (clang)
        run: ./premake5 gmake2 --cc=clang

      - name: Build compile database
        run: |
          export LIBRARY_PATH="/usr/local/lib:${LIBRARY_PATH}"
          export LD_LIBRARY_PATH="/usr/local/lib:${LD_LIBRARY_PATH}"
          bear -- make -j"$(nproc)" config=debug_x64 CC=clang CXX=clang++

      - name: Run clang-tidy (hard fail on warnings)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          # Normalize compile_commands paths so clang-tidy can resolve files
          # regardless of per-project build directories (Editor/Limitless/etc).
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shlex

          repo_root = Path(os.getcwd()).resolve()
          with open("compile_commands.json", "r", encoding="utf-8") as f:
              database = json.load(f)

          for entry in database:
              original_file = entry.get("file", "")
              args = entry.get("arguments")
              if args is None:
                  args = shlex.split(entry.get("command", ""))
                  entry["arguments"] = args
                  entry.pop("command", None)

              file_candidate = None
              if original_file:
                  raw_file = Path(original_file)
                  directory = Path(entry.get("directory", "."))
                  if not directory.is_absolute():
                      directory = (repo_root / directory).resolve()
                  file_candidate = raw_file if raw_file.is_absolute() else (directory / raw_file).resolve()

                  if not file_candidate.exists():
                      fallback_candidates = []
                      if not raw_file.is_absolute():
                          fallback_candidates.append((repo_root / raw_file).resolve())
                          if str(raw_file).startswith("Source/"):
                              for project_root in ("Limitless", "Editor", "Runtime", "Test"):
                                  fallback_candidates.append((repo_root / project_root / raw_file).resolve())

                      for candidate in fallback_candidates:
                          if candidate.exists():
                              file_candidate = candidate
                              break

                  if file_candidate.exists():
                      resolved_file = str(file_candidate)
                      entry["file"] = resolved_file

                      original_norm = str(original_file).replace("\\", "/").lower()
                      rewritten_args = []
                      replaced_source_arg = False
                      for arg in args:
                          if not isinstance(arg, str):
                              rewritten_args.append(arg)
                              continue

                          arg_norm = arg.replace("\\", "/").lower()
                          arg_is_cpp = arg_norm.endswith(".cpp")
                          arg_looks_like_source = arg_norm.startswith("source/") or "/source/" in arg_norm

                          if (
                              arg == original_file
                              or arg_norm == original_norm
                              or (
                                  arg_is_cpp
                                  and arg_looks_like_source
                                  and (
                                      original_norm.endswith(arg_norm)
                                      or arg_norm.endswith(original_norm)
                                  )
                              )
                          ):
                              rewritten_args.append(resolved_file)
                              replaced_source_arg = True
                          else:
                              rewritten_args.append(arg)

                      if not replaced_source_arg and rewritten_args:
                          # Last-resort repair for compile commands that keep a stale
                          # relative source argument even after file path normalization.
                          last_arg = rewritten_args[-1]
                          if isinstance(last_arg, str):
                              last_norm = last_arg.replace("\\", "/").lower()
                              if last_norm.endswith(".cpp") and (last_norm.startswith("source/") or "/source/" in last_norm):
                                  rewritten_args[-1] = resolved_file

                      entry["arguments"] = rewritten_args

          with open("compile_commands.json", "w", encoding="utf-8") as f:
              json.dump(database, f, indent=2)
          PY

          BASE_SHA=""
          HEAD_SHA=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            HEAD_SHA="$PR_HEAD_SHA"
            if [ -n "$PR_BASE_REF" ]; then
              git fetch --no-tags --prune --depth=200 origin "refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF" || true
            fi
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$PUSH_HEAD_SHA"
          fi

          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_REF" ] && \
             [ -n "$HEAD_SHA" ] && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null && \
             git rev-parse --verify "origin/$PR_BASE_REF" >/dev/null 2>&1; then
            (git diff --name-only --diff-filter=ACMR "origin/$PR_BASE_REF...$HEAD_SHA" | rg '^(Limitless|Editor|Runtime|Test)/Source/.*\.cpp$' > clang-tidy-files.txt) || true
          elif [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && \
               [ -n "$HEAD_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            (git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" | rg '^(Limitless|Editor|Runtime|Test)/Source/.*\.cpp$' > clang-tidy-files.txt) || true
          elif [ -n "$HEAD_SHA" ] && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "Diff base commit unavailable; falling back to changed files in HEAD commit."
            (git show --name-only --pretty="" --diff-filter=ACMR "$HEAD_SHA" | rg '^(Limitless|Editor|Runtime|Test)/Source/.*\.cpp$' > clang-tidy-files.txt) || true
          else
            echo "Unable to determine changed files from git history."
            : > clang-tidy-files.txt
          fi

          if [ ! -s clang-tidy-files.txt ]; then
            echo "No changed first-party source files to analyze."
            exit 0
          fi
          sort -u -o clang-tidy-files.txt clang-tidy-files.txt

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          repo_root = Path(os.getcwd()).resolve()
          with open("compile_commands.json", "r", encoding="utf-8") as f:
              database = json.load(f)

          compile_db_files = set()
          for entry in database:
              file_path = entry.get("file")
              if not file_path:
                  continue

              directory = Path(entry.get("directory", "."))
              if not directory.is_absolute():
                  directory = (repo_root / directory).resolve()

              candidate = Path(file_path)
              if not candidate.is_absolute():
                  candidate = (directory / candidate).resolve()
              else:
                  candidate = candidate.resolve()

              try:
                  rel = candidate.relative_to(repo_root).as_posix()
                  compile_db_files.add(rel)
              except ValueError:
                  pass

          changed_files_path = repo_root / "clang-tidy-files.txt"
          with changed_files_path.open("r", encoding="utf-8") as f:
              changed = [line.strip() for line in f if line.strip()]

          filtered = [path for path in changed if path in compile_db_files]
          with changed_files_path.open("w", encoding="utf-8") as f:
              f.write("\n".join(filtered))
              if filtered:
                  f.write("\n")
          print(f"Filtered changed files to {len(filtered)} entries present in compile_commands.json.")
          PY

          if [ ! -s clang-tidy-files.txt ]; then
            echo "No changed source files matched compile_commands.json entries."
            exit 0
          fi
          echo "Analyzing $(wc -l < clang-tidy-files.txt) changed C++ source files."

          # Run in batches to reduce process startup overhead and keep logs concise.
          xargs -r -a clang-tidy-files.txt -n 40 \
            clang-tidy -p . -quiet \
            -checks='-*,clang-analyzer-*,-clang-analyzer-optin.core.EnumCastOutOfRange' \
            -warnings-as-errors='*'
