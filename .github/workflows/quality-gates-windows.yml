name: Quality Gates Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  msvc-analyzer:
    name: MSVC Analyzer Gate
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Download premake5
        run: |
          if (!(Test-Path "Vendor\Premake")) {
            New-Item -ItemType Directory -Path "Vendor\Premake" -Force | Out-Null
          }

          $premakeUrl = "https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-windows.zip"
          $premakeZip = "Vendor\Premake\premake5.zip"
          $premakeDir = "Vendor\Premake"

          Invoke-WebRequest -Uri $premakeUrl -OutFile $premakeZip
          Expand-Archive -Path $premakeZip -DestinationPath $premakeDir -Force
          Remove-Item $premakeZip

          Vendor\Premake\premake5.exe --version

      - name: Generate Visual Studio solution
        run: |
          Vendor\Premake\premake5.exe vs2022
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Determine analyzer targets from changed files
        id: analyzer_targets
        run: |
          $eventName = "${{ github.event_name }}"
          $baseSha = ""
          $headSha = ""
          if ($eventName -eq "pull_request") {
            $baseSha = "${{ github.event.pull_request.base.sha }}"
            $headSha = "${{ github.event.pull_request.head.sha }}"
          } else {
            $baseSha = "${{ github.event.before }}"
            $headSha = "${{ github.sha }}"
          }

          if (![string]::IsNullOrWhiteSpace($baseSha) -and $baseSha -ne "0000000000000000000000000000000000000000") {
            $changedFiles = git diff --name-only --diff-filter=ACMR $baseSha $headSha
          } else {
            $changedFiles = git ls-files
          }

          $targets = New-Object System.Collections.Generic.HashSet[string]
          foreach ($file in $changedFiles) {
            if ($file -match '^Editor/Source/') { [void]$targets.Add("Editor") }
            if ($file -match '^Runtime/Source/') { [void]$targets.Add("Runtime") }
            # Keep MSVC analyzer focused on Windows-facing engine paths to control runtime.
            if ($file -match '^Limitless/Source/Platform/(Windows|SDL)/') { [void]$targets.Add("Limitless") }
          }

          if ($targets.Count -eq 0) {
            Write-Host "No changed files mapped to MSVC analyzer targets. Skipping analyzer gate."
            "targets=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $targetList = ($targets | Sort-Object) -join ';'
          Write-Host "MSVC analyzer targets: $targetList"
          "targets=$targetList" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build analyzer target dependencies
        if: steps.analyzer_targets.outputs.targets != ''
        run: |
          msbuild LimitlessRemaster.sln `
            "/t:${{ steps.analyzer_targets.outputs.targets }}" `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /m `
            /p:BuildProjectReferences=true `
            /p:RunCodeAnalysis=false `
            /v:minimal

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build with MSVC code analysis (first-party hard gate)
        if: steps.analyzer_targets.outputs.targets != ''
        run: |
          $analyzeLog = "msvc-analyze.log"
          msbuild LimitlessRemaster.sln `
            "/t:${{ steps.analyzer_targets.outputs.targets }}" `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /m `
            /p:BuildProjectReferences=false `
            /p:RunCodeAnalysis=true `
            /p:CodeAnalysisTreatWarningsAsErrors=false `
            /p:TreatWarningsAsErrors=true `
            /v:minimal `
            /fl `
            "/flp:logfile=$analyzeLog;verbosity=normal"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if (!(Test-Path $analyzeLog)) {
            Write-Error "MSVC analyzer log not found: $analyzeLog"
            exit 1
          }

          $repoRoot = (Get-Location).Path
          $diagRegex = '^(?<path>.+)\((?<line>\d+)(?:,\d+)?\):\s+(?<severity>warning|error)\s+(?<code>C\d+):\s+(?<message>.+)$'
          $firstPartyDiagnostics = New-Object System.Collections.Generic.List[string]

          foreach ($line in Get-Content $analyzeLog) {
            $match = [regex]::Match($line, $diagRegex)
            if (!$match.Success) { continue }

            $rawPath = $match.Groups["path"].Value.Trim()
            if ([string]::IsNullOrWhiteSpace($rawPath)) { continue }
            $normalizedPath = $rawPath.Replace('/', '\')
            if (-not [System.IO.Path]::IsPathRooted($normalizedPath)) {
              $normalizedPath = [System.IO.Path]::GetFullPath((Join-Path $repoRoot $normalizedPath))
            } else {
              $normalizedPath = [System.IO.Path]::GetFullPath($normalizedPath)
            }

            # Ignore third-party/vendor diagnostics; hard-fail only on first-party source trees.
            if ($normalizedPath -match '\\Vendor\\') { continue }
            if ($normalizedPath -match '\\(Editor|Limitless|Runtime|Test)\\Source\\') {
              [void]$firstPartyDiagnostics.Add($line)
            }
          }

          if ($firstPartyDiagnostics.Count -gt 0) {
            Write-Host "First-party analyzer diagnostics captured: $($firstPartyDiagnostics.Count)"
          } else {
            Write-Host "No first-party analyzer diagnostics found."
          }

          if ($firstPartyDiagnostics.Count -gt 0) {
            Write-Host "Failing on first-party analyzer diagnostics:"
            $firstPartyDiagnostics | ForEach-Object { Write-Host $_ }
            exit 1
          }

      - name: Run tests
        if: steps.analyzer_targets.outputs.targets != ''
        run: |
          $testExe = Get-ChildItem -Path Build -Recurse -Filter "Test.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName

          if ($null -eq $testExe -or !(Test-Path $testExe)) {
            Write-Host "Test executable not found under Build/. Skipping test run for current analyzer targets."
            exit 0
          }

          & $testExe --no-success --abort-after=1
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  clang-tidy-windows:
    name: Clang-Tidy Gate (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Install LLVM clang-tidy
        run: |
          choco install llvm -y --no-progress
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (!(Test-Path "$llvmBin\clang-tidy.exe")) {
            Write-Error "clang-tidy.exe not found at $llvmBin"
            exit 1
          }
          "$llvmBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install ms2cc
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/freddiehaddad/ms2cc/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match '(?i)(windows|win).*\.zip$' } | Select-Object -First 1
          if ($null -eq $asset) {
            $asset = $release.assets | Where-Object { $_.name -match '\.zip$' } | Select-Object -First 1
          }
          if ($null -eq $asset) {
            Write-Error "Unable to locate a downloadable ms2cc release asset."
            exit 1
          }

          $zipPath = "$env:RUNNER_TEMP\ms2cc.zip"
          $extractDir = "$env:RUNNER_TEMP\ms2cc"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force

          $ms2ccExe = Get-ChildItem -Path $extractDir -Recurse -Filter "ms2cc.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($ms2ccExe)) {
            Write-Error "ms2cc.exe was not found in downloaded release archive."
            exit 1
          }

          Split-Path -Parent $ms2ccExe | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download premake5
        run: |
          if (!(Test-Path "Vendor\Premake")) {
            New-Item -ItemType Directory -Path "Vendor\Premake" -Force | Out-Null
          }

          $premakeUrl = "https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-windows.zip"
          $premakeZip = "Vendor\Premake\premake5.zip"
          $premakeDir = "Vendor\Premake"

          Invoke-WebRequest -Uri $premakeUrl -OutFile $premakeZip
          Expand-Archive -Path $premakeZip -DestinationPath $premakeDir -Force
          Remove-Item $premakeZip

          Vendor\Premake\premake5.exe --version

      - name: Generate Visual Studio solution
        run: |
          Vendor\Premake\premake5.exe vs2022
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build with detailed logging
        run: |
          msbuild LimitlessRemaster.sln `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /m `
            /p:BuildProjectReferences=true `
            /v:minimal `
            /fl `
            "/flp:logfile=msbuild.log;verbosity=detailed"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Generate compile_commands.json with ms2cc
        run: |
          ms2cc -i msbuild.log -o compile_commands.json
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ms2cc failed to generate compile_commands.json"
            exit $LASTEXITCODE
          }
          if (!(Test-Path "compile_commands.json")) {
            Write-Error "compile_commands.json not found after ms2cc run"
            exit 1
          }

      - name: Run clang-tidy (hard fail on warnings)
        run: |
          $eventName = "${{ github.event_name }}"
          $prBaseRef = "${{ github.event.pull_request.base.ref }}"
          $prBaseSha = "${{ github.event.pull_request.base.sha }}"
          $pushBeforeSha = "${{ github.event.before }}"
          $headSha = ""
          $baseSha = ""
          if ($eventName -eq "pull_request") {
            $baseSha = $prBaseSha
            $headSha = "${{ github.event.pull_request.head.sha }}"
          } else {
            $baseSha = $pushBeforeSha
            $headSha = "${{ github.sha }}"
            if ([string]::IsNullOrWhiteSpace($baseSha) -or $baseSha -eq "0000000000000000000000000000000000000000") {
              if (-not [string]::IsNullOrWhiteSpace($headSha)) {
                & git cat-file -e "$headSha^" 2>$null
                if ($LASTEXITCODE -eq 0) {
                  $baseSha = (git rev-parse "$headSha^").Trim()
                }
              }
            }
          }

          $compileCommandsPath = "compile_commands.json"
          if (!(Test-Path $compileCommandsPath)) {
            Write-Error "compile_commands.json not found before clang-tidy run"
            exit 1
          }

          function Resolve-CompileDbPath {
            param(
              [string]$RawPath,
              [string]$DirectoryPath,
              [string]$RepoRoot
            )
            if ([string]::IsNullOrWhiteSpace($RawPath)) { return $null }

            $candidate = $null
            if ([System.IO.Path]::IsPathRooted($RawPath)) {
              $candidate = [System.IO.Path]::GetFullPath($RawPath)
            } else {
              $dir = $DirectoryPath
              if ([string]::IsNullOrWhiteSpace($dir)) { $dir = $RepoRoot }
              if (-not [System.IO.Path]::IsPathRooted($dir)) {
                $dir = [System.IO.Path]::GetFullPath((Join-Path $RepoRoot $dir))
              } else {
                $dir = [System.IO.Path]::GetFullPath($dir)
              }
              $candidate = [System.IO.Path]::GetFullPath((Join-Path $dir $RawPath))
            }

            if (Test-Path $candidate) { return $candidate }
            if ([System.IO.Path]::IsPathRooted($RawPath)) { return $candidate }

            $fallback = [System.IO.Path]::GetFullPath((Join-Path $RepoRoot $RawPath))
            if (Test-Path $fallback) { return $fallback }

            if ($RawPath -like "Source/*") {
              foreach ($projectRoot in @("Limitless", "Editor", "Runtime", "Test")) {
                $projectCandidate = [System.IO.Path]::GetFullPath((Join-Path (Join-Path $RepoRoot $projectRoot) $RawPath))
                if (Test-Path $projectCandidate) { return $projectCandidate }
              }
            }

            return $candidate
          }

          function Test-GitCommitExists {
            param([string]$Sha)
            if ([string]::IsNullOrWhiteSpace($Sha)) { return $false }
            $spec = "$Sha^{commit}"
            & git cat-file -e $spec 2>$null
            return ($LASTEXITCODE -eq 0)
          }

          function Test-GitRefExists {
            param([string]$RefName)
            if ([string]::IsNullOrWhiteSpace($RefName)) { return $false }
            & git rev-parse --verify $RefName *> $null
            return ($LASTEXITCODE -eq 0)
          }

          $compileCommands = Get-Content $compileCommandsPath -Raw | ConvertFrom-Json
          $repoRoot = (Get-Location).Path

          # Normalize compile_commands source paths and strip problematic PCH/forced-include
          # flags that frequently break clang-tidy portability on CI.
          foreach ($entry in $compileCommands) {
            $originalFile = [string]$entry.file
            $resolvedFile = Resolve-CompileDbPath -RawPath $originalFile -DirectoryPath ([string]$entry.directory) -RepoRoot $repoRoot
            if (-not [string]::IsNullOrWhiteSpace($resolvedFile) -and (Test-Path $resolvedFile)) {
              $entry.file = $resolvedFile
            }

            if ($entry.PSObject.Properties.Name -contains "arguments" -and $null -ne $entry.arguments) {
              $cleaned = New-Object System.Collections.Generic.List[string]
              for ($idx = 0; $idx -lt $entry.arguments.Count; $idx++) {
                $arg = [string]$entry.arguments[$idx]
                if ([string]::IsNullOrWhiteSpace($arg)) { continue }

                # Remove force-include and PCH flags that can make clang-tidy fail
                # due to compile-db path mismatches.
                if ($arg -in @('/FI', '-include', '-include-pch', '/Yu', '/Fp')) {
                  if ($idx + 1 -lt $entry.arguments.Count) { $idx++ }
                  continue
                }
                if ($arg -like '/FI*' -or $arg -like '/Yu*' -or $arg -like '/Fp*') {
                  continue
                }
                if ($arg -match 'PrecompiledHeader\.h(\.pch|\.gch)?$' -or $arg -match '\.gch$' -or $arg -match '\.pch$') {
                  continue
                }

                if (-not [string]::IsNullOrWhiteSpace($entry.file) -and $arg -eq $originalFile) {
                  [void]$cleaned.Add([string]$entry.file)
                } else {
                  [void]$cleaned.Add($arg)
                }
              }
              $entry.arguments = @($cleaned)
            }
          }
          $compileCommands | ConvertTo-Json -Depth 100 | Set-Content -Path $compileCommandsPath -Encoding UTF8

          if ($eventName -eq "pull_request" -and ![string]::IsNullOrWhiteSpace($prBaseRef)) {
            git fetch --no-tags --prune --depth=200 origin ("refs/heads/{0}:refs/remotes/origin/{0}" -f $prBaseRef) 2>$null
          }
          if ($eventName -eq "pull_request" -and ![string]::IsNullOrWhiteSpace($prBaseSha) -and -not (Test-GitCommitExists -Sha $prBaseSha)) {
            git fetch --no-tags --prune --depth=200 origin $prBaseSha 2>$null
          }

          $candidateFiles = @()
          if ($eventName -eq "pull_request" -and ![string]::IsNullOrWhiteSpace($prBaseRef) -and ![string]::IsNullOrWhiteSpace($headSha)) {
            $headOk = Test-GitCommitExists -Sha $headSha
            $baseRefOk = Test-GitRefExists -RefName "origin/$prBaseRef"
            if ($headOk -and $baseRefOk) {
              $candidateFiles = git diff --name-only --diff-filter=ACMR "origin/$prBaseRef...$headSha"
            }
          }
          if (($null -eq $candidateFiles -or $candidateFiles.Count -eq 0) -and
              ![string]::IsNullOrWhiteSpace($baseSha) -and
              $baseSha -ne "0000000000000000000000000000000000000000" -and
              ![string]::IsNullOrWhiteSpace($headSha)) {
            $baseOk = Test-GitCommitExists -Sha $baseSha
            $headOk = Test-GitCommitExists -Sha $headSha
            if ($baseOk -and $headOk) {
              $candidateFiles = git diff --name-only --diff-filter=ACMR $baseSha $headSha
            }
          }
          if (($null -eq $candidateFiles -or $candidateFiles.Count -eq 0) -and ![string]::IsNullOrWhiteSpace($headSha)) {
            $headOk = Test-GitCommitExists -Sha $headSha
            if ($headOk) {
              & git cat-file -e "$headSha^" 2>$null
              if ($LASTEXITCODE -eq 0) {
                $parentSha = (git rev-parse "$headSha^").Trim()
                if (-not [string]::IsNullOrWhiteSpace($parentSha)) {
                  $candidateFiles = git diff --name-only --diff-filter=ACMR $parentSha $headSha
                }
              }
            }
          }
          if (($null -eq $candidateFiles -or $candidateFiles.Count -eq 0) -and ![string]::IsNullOrWhiteSpace($headSha)) {
            $headOk = Test-GitCommitExists -Sha $headSha
            if ($headOk) {
              Write-Host "Diff base commit unavailable; falling back to changed files in HEAD commit."
              $candidateFiles = git show --name-only --pretty="" --diff-filter=ACMR $headSha
            }
          }

          $sourceFiles = @($candidateFiles | Where-Object { $_ -match '^(Limitless|Editor|Runtime|Test)/Source/.*\.cpp$' } | Sort-Object -Unique)
          if ($null -eq $sourceFiles -or $sourceFiles.Count -eq 0) {
            Write-Host "No changed first-party source files to analyze."
            exit 0
          }
          Write-Host "Analyzing $($sourceFiles.Count) changed C++ source files."

          $compileSet = New-Object 'System.Collections.Generic.HashSet[string]' ([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($entry in $compileCommands) {
            $entryFile = [string]$entry.file
            if ([string]::IsNullOrWhiteSpace($entryFile)) { continue }
            $normalized = Resolve-CompileDbPath -RawPath $entryFile -DirectoryPath ([string]$entry.directory) -RepoRoot $repoRoot
            if ([string]::IsNullOrWhiteSpace($normalized)) { continue }
            [void]$compileSet.Add($normalized)
          }

          $filtered = New-Object System.Collections.Generic.List[string]
          foreach ($relPath in $sourceFiles) {
            if ([string]::IsNullOrWhiteSpace($relPath)) { continue }
            $absPath = [System.IO.Path]::GetFullPath((Join-Path $repoRoot $relPath))
            if ($compileSet.Contains($absPath)) {
              [void]$filtered.Add($relPath)
            }
          }
          $sourceFiles = @($filtered | Sort-Object -Unique)
          if ($sourceFiles.Count -eq 0) {
            Write-Host "No changed source files matched compile_commands.json entries."
            exit 0
          }
          Write-Host "Filtered changed files to $($sourceFiles.Count) entries present in compile_commands.json."

          $chunkSize = 40
          $hadFailure = $false
          $clangTidyArgsCommon = @(
            "-p", ".",
            "-quiet",
            "--extra-arg-before=-I$repoRoot\Editor",
            "--extra-arg-before=-I$repoRoot\Editor\Source",
            "--extra-arg-before=-I$repoRoot\Limitless",
            "--extra-arg-before=-I$repoRoot\Limitless\Source",
            "--extra-arg-before=-I$repoRoot\Limitless\Vendor",
            "--extra-arg-before=-I$repoRoot\Limitless\Vendor\doctest",
            "--extra-arg-before=-I$repoRoot\Runtime",
            "--extra-arg-before=-I$repoRoot\Runtime\Source",
            "--extra-arg-before=-I$repoRoot\Test",
            "--extra-arg-before=-I$repoRoot\Test\Source",
            "-header-filter=.*/(Limitless|Editor|Runtime|Test)/Source/.*",
            "-checks=-*,clang-analyzer-*,-clang-analyzer-optin.core.EnumCastOutOfRange,-clang-analyzer-cplusplus.NewDeleteLeaks,-clang-analyzer-optin.cplusplus.UninitializedObject",
            "-warnings-as-errors=*"
          )
          for ($i = 0; $i -lt $sourceFiles.Count; $i += $chunkSize) {
            $end = [Math]::Min($i + $chunkSize - 1, $sourceFiles.Count - 1)
            $batch = $sourceFiles[$i..$end]
            & clang-tidy @batch @clangTidyArgsCommon
            if ($LASTEXITCODE -ne 0) {
              $hadFailure = $true
            }
          }

          if ($hadFailure) {
            exit 1
          }
