name: Test macOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-macos:
    name: Test macOS Build
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Ensure Coral vendor sources
      run: |
        if [ ! -f "Limitless/Vendor/Coral/Coral.Native/Include/Coral/Assembly.hpp" ]; then
          rm -rf Limitless/Vendor/Coral
          git clone https://github.com/hcfgod/Coral.git Limitless/Vendor/Coral
          git -C Limitless/Vendor/Coral checkout 087b32322c4834bf6054d232914869f2b5637bfc
          rm -rf Limitless/Vendor/Coral/.git
        fi
        test -f "Limitless/Vendor/Coral/Coral.Native/Include/Coral/Assembly.hpp"

    - name: Ensure Unix build scripts are executable
      run: |
        chmod +x Scripts/build-unix.sh
        chmod +x Scripts/build-scriptcore-unix.sh
        chmod +x Scripts/build-runtime-unix.sh
      
    - name: Install macOS dependencies
      run: |
        brew install pkg-config sdl3 box2d ffmpeg
        echo "SDL3 installation info:"
        brew list sdl3
        echo "Box2D installation info:"
        brew list box2d
        echo "FFmpeg installation info:"
        brew list ffmpeg
        echo "pkg-config probes:"
        pkg-config --modversion sdl3
        pkg-config --modversion libavcodec
        pkg-config --modversion libavformat
        pkg-config --modversion libavutil
        pkg-config --modversion libswresample
        BOX2D_PREFIX=$(brew --prefix box2d)
        echo "Box2D prefix: ${BOX2D_PREFIX}"
        ls -la "${BOX2D_PREFIX}/lib/libbox2d.dylib"
        
    - name: Download premake5
      run: |
        echo "Downloading premake5..."
        curl -L -o premake5.tar.gz https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-macosx.tar.gz
        tar -xzf premake5.tar.gz
        chmod +x premake5
        
        echo "Premake5 version:"
        ./premake5 --version
        
    - name: Generate Makefiles
      run: |
        echo "Generating Makefiles..."
        ./premake5 gmake2
        
        if [ ! -f "Makefile" ]; then
          echo "Error: Makefile was not generated"
          exit 1
        fi
        
        echo "Makefile generated successfully"
        
    - name: Build ARM64
      run: |
        echo "Building ARM64 configuration..."
        make -j$(sysctl -n hw.ncpu) config=debug_arm64
        
        if [ $? -ne 0 ]; then
          echo "Error: ARM64 build failed"
          exit 1
        fi
        
        echo "ARM64 build completed successfully!"
        
    - name: Build x64
      run: |
        echo "Building x64 configuration..."
        make -j$(sysctl -n hw.ncpu) config=debug_x64
        
        if [ $? -ne 0 ]; then
          echo "Error: x64 build failed"
          exit 1
        fi
        
        echo "x64 build completed successfully!"
        
    - name: List build output
      run: |
        echo "Build directory contents:"
        ls -la Build/ || echo "Build directory not found"
        
        echo "ARM64 build output:"
        ls -la Build/debug_arm64-macosx-ARM64/ || echo "ARM64 build directory not found"
        
        echo "x64 build output:"
        ls -la Build/debug_x64-macosx-x64/ || echo "x64 build directory not found"
        
    - name: Run ARM64 tests
      timeout-minutes: 16
      run: |
        TEST_EXE=$(find Build/debug_arm64-macosx-ARM64/ -name "Test" -type f 2>/dev/null | head -1)
        if [ -n "$TEST_EXE" ]; then
          echo "Running ARM64 tests..."
          TIMEOUT_SECONDS=900
          "$TEST_EXE" --no-success --abort-after=1 &
          test_pid=$!

          (
            sleep "$TIMEOUT_SECONDS"
            if kill -0 "$test_pid" 2>/dev/null; then
              echo "ARM64 test run timed out after ${TIMEOUT_SECONDS}s (possible deadlock/livelock)."
              kill -TERM "$test_pid" 2>/dev/null || true
              sleep 30
              kill -KILL "$test_pid" 2>/dev/null || true
            fi
          ) &
          watchdog_pid=$!

          if wait "$test_pid"; then
            test_exit=0
          else
            test_exit=$?
          fi

          kill "$watchdog_pid" 2>/dev/null || true
          wait "$watchdog_pid" 2>/dev/null || true

          if [ $test_exit -eq 143 ] || [ $test_exit -eq 137 ]; then
            test_exit=124
          fi

          if [ $test_exit -eq 0 ]; then
            echo "All ARM64 tests passed!"
          else
            echo "Error: Some ARM64 tests failed"
            exit $test_exit
          fi
        else
          echo "ARM64 test executable not found"
          exit 1
        fi
        
    - name: Run x64 tests
      timeout-minutes: 16
      run: |
        TEST_EXE=$(find Build/debug_x64-macosx-x64/ -name "Test" -type f 2>/dev/null | head -1)
        if [ -n "$TEST_EXE" ]; then
          echo "Running x64 tests..."
          TIMEOUT_SECONDS=900
          "$TEST_EXE" --no-success --abort-after=1 &
          test_pid=$!

          (
            sleep "$TIMEOUT_SECONDS"
            if kill -0 "$test_pid" 2>/dev/null; then
              echo "x64 test run timed out after ${TIMEOUT_SECONDS}s (possible deadlock/livelock)."
              kill -TERM "$test_pid" 2>/dev/null || true
              sleep 30
              kill -KILL "$test_pid" 2>/dev/null || true
            fi
          ) &
          watchdog_pid=$!

          if wait "$test_pid"; then
            test_exit=0
          else
            test_exit=$?
          fi

          kill "$watchdog_pid" 2>/dev/null || true
          wait "$watchdog_pid" 2>/dev/null || true

          if [ $test_exit -eq 143 ] || [ $test_exit -eq 137 ]; then
            test_exit=124
          fi

          if [ $test_exit -eq 0 ]; then
            echo "All x64 tests passed!"
          else
            echo "Error: Some x64 tests failed"
            exit $test_exit
          fi
        else
          echo "x64 test executable not found"
          exit 1
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: macos-build-artifacts
        path: |
          Build/
          Makefile
        retention-days: 7 